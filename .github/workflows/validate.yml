name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check data, prerender shell, and core syntax
        run: npm run check

      - name: Parse every JS module
        run: |
          set -e
          for file in js/*.js js/*/*.js sw.js scripts/*.mjs; do
            node --check "$file"
          done
          echo "All modules parsed."
